<!-- @dsCard group="Type" viewport="700x150" subtitle="JetBrains Mono — eyebrows, field labels, meta, badges" name="Mono — labels & eyebrows" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); padding: 20px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .eyebrow { font-size: var(--fs-eyebrow); letter-spacing: var(--track-eyebrow-wide); text-transform: uppercase; color: var(--text-label); }
  .label { font-size: var(--fs-eyebrow); letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--ink-4); }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-eyebrow); color: var(--ink-2); border: 1px solid var(--line-1); border-radius: var(--r-lg); padding: 4px 9px; width: max-content; }
</style>
</head>
<body>
  <div class="stack">
    <div class="eyebrow">BRIEFING · ACTION REQUISE · WIDE 0.14em</div>
    <div class="label">NOM DE L'OBJET · DESCRIPTION · LABEL 0.08em</div>
    <div class="badge">⠿ MONSTRE · #4 — badge mono</div>
  </div>
</body>
</html>
