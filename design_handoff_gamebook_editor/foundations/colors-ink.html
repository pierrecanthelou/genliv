<!-- @dsCard group="Colors" viewport="700x150" subtitle="Ink ramp — primary text → faint hairline" name="Ink / text" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); padding: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 88px; }
  .chip { height: 52px; border-radius: var(--r-xl); }
  .name { font-size: 9.5px; color: var(--ink-2); margin-top: 7px; }
  .hex { font-size: 9px; color: var(--ink-4); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-0)"></div><div class="name">--ink-0</div><div class="hex">#2B2B29</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-1)"></div><div class="name">--ink-1</div><div class="hex">#4E4E4B</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="name">--ink-2</div><div class="hex">#6E6E6A</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-3)"></div><div class="name">--ink-3</div><div class="hex">#8A8A86</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-4)"></div><div class="name">--ink-4</div><div class="hex">#9A9A96</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-5)"></div><div class="name">--ink-5</div><div class="hex">#B0B0AB</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-6)"></div><div class="name">--ink-6</div><div class="hex">#C2C2BE</div></div>
  </div>
</body>
</html>
