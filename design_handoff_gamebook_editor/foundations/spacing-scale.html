<!-- @dsCard group="Spacing" viewport="700x140" subtitle="4 → 40px rhythm" name="Spacing scale" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); padding: 18px; }
  .row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .sw { text-align: center; }
  .bar { background: var(--accent); border-radius: var(--r-xs); width: 100%; }
  .n { font-size: 8.5px; color: var(--ink-3); margin-top: 8px; }
  .wrap { width: 40px; display: flex; align-items: flex-end; height: 44px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="wrap"><div class="bar" style="height:4px"></div></div><div class="n">1 · 4</div></div>
    <div class="sw"><div class="wrap"><div class="bar" style="height:6px"></div></div><div class="n">2 · 6</div></div>
    <div class="sw"><div class="wrap"><div class="bar" style="height:8px"></div></div><div class="n">3 · 8</div></div>
    <div class="sw"><div class="wrap"><div class="bar" style="height:10px"></div></div><div class="n">4 · 10</div></div>
    <div class="sw"><div class="wrap"><div class="bar" style="height:12px"></div></div><div class="n">5 · 12</div></div>
    <div class="sw"><div class="wrap"><div class="bar" style="height:14px"></div></div><div class="n">6 · 14</div></div>
    <div class="sw"><div class="wrap"><div class="bar" style="height:16px"></div></div><div class="n">7 · 16</div></div>
    <div class="sw"><div class="wrap"><div class="bar" style="height:18px"></div></div><div class="n">8 · 18</div></div>
    <div class="sw"><div class="wrap"><div class="bar" style="height:22px"></div></div><div class="n">9 · 22</div></div>
    <div class="sw"><div class="wrap"><div class="bar" style="height:28px"></div></div><div class="n">10 · 28</div></div>
    <div class="sw"><div class="wrap"><div class="bar" style="height:40px"></div></div><div class="n">12 · 40</div></div>
  </div>
</body>
</html>
