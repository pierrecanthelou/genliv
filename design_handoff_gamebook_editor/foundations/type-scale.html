<!-- @dsCard group="Type" viewport="700x180" subtitle="Size ramp 9.5 → 30px" name="Scale" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-ui); background: var(--surface-card); padding: 18px; color: var(--text-strong); }
  .line { display: flex; align-items: baseline; gap: 12px; padding: 3px 0; }
  .tok { font-family: var(--font-mono); font-size: 9px; color: var(--ink-4); width: 120px; flex: none; }
  .spec { font-weight: var(--fw-semibold); }
</style>
</head>
<body>
  <div class="line"><span class="tok">--fs-h1 · 30</span><span class="spec" style="font-size:30px;letter-spacing:-.02em">Livre</span></div>
  <div class="line"><span class="tok">--fs-h2 · 20</span><span class="spec" style="font-size:20px">Sous-titre</span></div>
  <div class="line"><span class="tok">--fs-title · 16</span><span class="spec" style="font-size:16px">Titre de carte</span></div>
  <div class="line"><span class="tok">--fs-row · 13.5</span><span class="spec" style="font-size:13.5px">Ligne de liste</span></div>
  <div class="line"><span class="tok">--fs-body · 12.5</span><span style="font-size:12.5px">Corps de texte</span></div>
  <div class="line"><span class="tok">--fs-meta · 10.5</span><span style="font-size:10.5px;color:var(--ink-3)">Méta / caption</span></div>
  <div class="line"><span class="tok">--fs-eyebrow · 9.5</span><span style="font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-4)">EYEBROW</span></div>
</body>
</html>
